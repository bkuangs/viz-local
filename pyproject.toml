[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "viz-local"
version = "0.1.0"
description = "A bounded experiment in failure-aware visual localization"
requires-python = ">=3.10,<3.11"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy==1.26.4",
    "scipy==1.15.3",
    "h5py==3.14.0",
    "opencv-python==4.11.0.86",
    "pillow==11.3.0",
    "pycolmap==3.13.0",
    "hloc",
    "lightglue",
]

[tool.setuptools]
packages = ["viz_local"]

[tool.uv]
override-dependencies = [
    "lightglue @ git+https://github.com/cvg/LightGlue@eb42fee2d71449efb0aa5c10549752b5d75384d8",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }
hloc = { path = "external/hloc", editable = true }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
